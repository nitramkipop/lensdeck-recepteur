<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=600, height=600, initial-scale=1">
<meta name="mrbd-web-app-capable" content="yes">
<title>LensDeck</title>
<link rel="icon" type="image/png" href="icon.png">
<style>
  html,body{margin:0;width:600px;height:600px;overflow:hidden;background:#000;color:#fff;
    font-family:system-ui,-apple-system,Roboto,sans-serif}
  #stage{position:absolute;inset:0;overflow:hidden;background:#000}
  video{position:absolute;left:0;top:0;width:600px;height:600px;background:#000}
  #status{position:absolute;left:0;right:0;top:230px;text-align:center;font-size:24px;line-height:34px;
    color:#4fd1c5;padding:0 40px}
  #status small{display:block;color:#B0B4BC;font-size:18px;margin-top:8px}
  #cursor{position:absolute;width:44px;height:44px;margin:-22px 0 0 -22px;border:4px solid #FFD600;
    border-radius:50%;box-shadow:0 0 0 3px #000;display:none;pointer-events:none}
  #cursor:before,#cursor:after{content:"";position:absolute;background:#FFD600}
  #cursor:before{left:18px;top:-14px;width:4px;height:64px}
  #cursor:after{top:18px;left:-14px;height:4px;width:64px}
  #menu{position:absolute;inset:0;background:rgba(0,0,0,.82);display:none;padding:18px 40px;box-sizing:border-box}
  #menu h2{margin:0 0 8px;font-size:22px;color:#4fd1c5}
  .item{font-size:22px;line-height:24px;padding:11px 16px;margin:4px 0;border-radius:14px;background:#1d2128;color:#fff}
  .item.sel{background:#4fd1c5;color:#04221f;font-weight:600}
  #toast{position:absolute;left:50%;bottom:26px;transform:translateX(-50%);background:#1d2128;color:#fff;
    font-size:20px;padding:10px 18px;border-radius:14px;display:none;white-space:nowrap}
  #info{position:absolute;right:10px;top:10px;font-size:16px;color:#7CFC9A;background:rgba(0,0,0,.6);
    padding:4px 8px;border-radius:8px;display:none}
</style>
</head>
<body>
<div id="stage">
  <video id="v" autoplay muted playsinline></video>
  <div id="cursor"></div>
  <div id="status">Démarrage…</div>
  <div id="info"></div>
  <div id="menu"><h2>Piloter le téléphone</h2><div id="items"></div></div>
  <div id="toast"></div>
</div>
<script>
// ---------------------------------------------------------------- Clé privée
const params = new URLSearchParams(location.search);
let KEY = params.get('k');
try { if (KEY) localStorage.setItem('ld_k', KEY); else KEY = localStorage.getItem('ld_k'); } catch (e) {}

const v = document.getElementById('v');
const statusEl = document.getElementById('status');
const cursorEl = document.getElementById('cursor');
const menuEl = document.getElementById('menu');
const itemsEl = document.getElementById('items');
const toastEl = document.getElementById('toast');
const infoEl = document.getElementById('info');
const rnd = () => Math.random().toString(16).slice(2, 10);

function setStatus(main, sub) {
  statusEl.style.display = main ? 'block' : 'none';
  statusEl.innerHTML = main ? main + (sub ? '<small>' + sub + '</small>' : '') : '';
}
let toastTimer;
function toast(t) { toastEl.textContent = t; toastEl.style.display = 'block';
  clearTimeout(toastTimer); toastTimer = setTimeout(() => toastEl.style.display = 'none', 1600); }

// ---------------------------------------------------------------- Affichage vidéo / zoom
let zoom = 'fit';      // 'fit' = écran entier, 'width' = pleine largeur (portrait)
let panY = 0;
let rect = { left: 0, top: 0, w: 600, h: 600 };
function layout() {
  const vw = v.videoWidth, vh = v.videoHeight;
  if (!vw || !vh) return;
  let w, h;
  if (zoom === 'fit' || vw >= vh) { const s = Math.min(600 / vw, 600 / vh); w = vw * s; h = vh * s; }
  else { w = 600; h = vh * 600 / vw; }
  const maxPan = Math.max(0, h - 600);
  panY = Math.min(Math.max(panY, 0), maxPan);
  const left = (600 - w) / 2, top = h <= 600 ? (600 - h) / 2 : -panY;
  v.style.width = w + 'px'; v.style.height = h + 'px'; v.style.left = left + 'px'; v.style.top = top + 'px';
  rect = { left, top, w, h };
  placeCursor();
}
v.addEventListener('resize', layout);
v.addEventListener('loadedmetadata', layout);
function canPan() { return zoom === 'width' && v.videoHeight > v.videoWidth && rect.h > 600; }
function pan(dy) {
  const before = panY; panY += dy; layout();
  return panY !== before;
}

// ---------------------------------------------------------------- Curseur
let mode = 'watch'; // watch | menu | cursor
let cx = 0.5, cy = 0.5, lastMove = 0, speed = 0.06, hideTimer;
let autoHide = true;
try { autoHide = localStorage.getItem('ld_autohide') !== '0'; } catch (e) {}
function placeCursor() {
  cursorEl.style.display = mode === 'cursor' ? 'block' : 'none';
  if (mode !== 'cursor') return;
  let x = rect.left + cx * rect.w, y = rect.top + cy * rect.h;
  // Suivre le curseur quand le zoom pleine largeur est actif.
  if (y > 560 && canPan()) { pan(y - 300); y = rect.top + cy * rect.h; }
  if (y < 40 && canPan()) { pan(y - 300); y = rect.top + cy * rect.h; }
  cursorEl.style.left = x + 'px'; cursorEl.style.top = y + 'px';
}
// Le curseur disparaît tout seul après quelques secondes sans geste.
function armHide() {
  clearTimeout(hideTimer);
  if (autoHide && mode === 'cursor') hideTimer = setTimeout(() => { if (mode === 'cursor') { mode = 'watch'; placeCursor(); } }, 6000);
}
function showCursor() { mode = 'cursor'; placeCursor(); armHide(); }
function hideCursor() { clearTimeout(hideTimer); mode = 'watch'; placeCursor(); }
function moveCursor(dx, dy) {
  const now = Date.now();
  // Accélère vite quand les glissements s'enchaînent.
  speed = now - lastMove < 500 ? Math.min(speed * 1.6, 0.22) : 0.06;
  lastMove = now;
  cx = Math.min(0.99, Math.max(0.01, cx + dx * speed));
  cy = Math.min(0.99, Math.max(0.01, cy + dy * speed * (rect.w / rect.h)));
  placeCursor(); armHide();
}

// ---------------------------------------------------------------- Menu
const MENU = [
  ['↓ Défiler vers le bas', () => send({ c: 'scroll', d: 'down' })],
  ['↑ Défiler vers le haut', () => send({ c: 'scroll', d: 'up' })],
  ['← Retour (téléphone)', () => send({ c: 'back' })],
  ['⌂ Accueil (téléphone)', () => send({ c: 'home' })],
  ['Apps récentes', () => send({ c: 'recents' })],
  ['Notifications', () => send({ c: 'notifs' })],
  [() => zoom === 'fit' ? 'Zoom : pleine largeur' : 'Zoom : écran entier', () => toggleZoom()],
  [() => autoHide ? 'Curseur : se masque seul (oui)' : 'Curseur : se masque seul (non)', () => {
    autoHide = !autoHide; try { localStorage.setItem('ld_autohide', autoHide ? '1' : '0'); } catch (e) {}
    toast(autoHide ? 'Le curseur se masque après 6 s' : 'Le curseur reste affiché'); }],
  [() => infoOn ? 'Masquer les infos' : 'Afficher les infos', () => { infoOn = !infoOn; infoEl.style.display = infoOn ? 'block' : 'none'; }],
  ['✕ Fermer', () => {}],
];
let sel = 0, menuReturn = 'watch';
function renderMenu() {
  itemsEl.innerHTML = '';
  MENU.forEach((m, i) => { const d = document.createElement('div'); d.className = 'item' + (i === sel ? ' sel' : '');
    d.textContent = typeof m[0] === 'function' ? m[0]() : m[0]; itemsEl.appendChild(d); });
}
function openMenu() { clearTimeout(hideTimer); mode = 'menu'; sel = 0; renderMenu(); menuEl.style.display = 'block'; cursorEl.style.display = 'none'; }
function closeMenu() { menuEl.style.display = 'none'; mode = 'watch'; placeCursor(); }
function toggleZoom() { zoom = zoom === 'fit' ? 'width' : 'fit'; panY = 0; layout();
  toast(zoom === 'fit' ? 'Écran entier' : 'Pleine largeur'); }

// ---------------------------------------------------------------- Gestes (Neural Band = flèches + Entrée)
// 1 pincement : affiche le curseur, puis touche l'écran. 2 pincements rapides : menu.
let pinchTimer = null;
function onPinch() {
  if (pinchTimer) { clearTimeout(pinchTimer); pinchTimer = null; openMenu(); return; }
  pinchTimer = setTimeout(() => {
    pinchTimer = null;
    if (mode === 'cursor') { send({ c: 'tap', x: cx, y: cy }); flash(); armHide(); }
    else showCursor();
  }, 350);
}
document.addEventListener('keydown', (e) => {
  const k = e.key;
  if (mode === 'menu') {
    if (k === 'ArrowDown') { sel = (sel + 1) % MENU.length; renderMenu(); }
    else if (k === 'ArrowUp') { sel = (sel - 1 + MENU.length) % MENU.length; renderMenu(); }
    else if (k === 'Enter' || k === ' ') { const act = MENU[sel][1]; closeMenu(); act(); }
    else if (k === 'Escape' || k === 'Backspace' || k === 'ArrowLeft') closeMenu();
    else return;
    e.preventDefault(); return;
  }
  if (k === 'Enter' || k === ' ') { onPinch(); e.preventDefault(); return; }
  if (mode === 'cursor') {
    if (k === 'ArrowUp') moveCursor(0, -1);
    else if (k === 'ArrowDown') moveCursor(0, 1);
    else if (k === 'ArrowLeft') moveCursor(-1, 0);
    else if (k === 'ArrowRight') moveCursor(1, 0);
    else if (k === 'Escape' || k === 'Backspace') { hideCursor(); toast('Curseur masqué'); }
    else return;
    e.preventDefault(); return;
  }
  // Mode « regarder » (sans curseur)
  if (k === 'ArrowLeft' || k === 'ArrowRight') toggleZoom();
  else if (k === 'ArrowDown') { if (!(canPan() && pan(160))) send({ c: 'scroll', d: 'down' }); }
  else if (k === 'ArrowUp') { if (!(canPan() && pan(-160))) send({ c: 'scroll', d: 'up' }); }
  else return; // Échap / retour : laissé au système (quitter l'app)
  e.preventDefault();
});
function flash() { cursorEl.style.borderColor = '#fff'; setTimeout(() => cursorEl.style.borderColor = '#FFD600', 180); }

// ---------------------------------------------------------------- Lien avec le téléphone (ntfy.sh)
let ws, pc, ctl, helloTimer, live = false, infoOn = false, lastHello = 0;
const MY_TOPIC = () => 'lensdeck-' + KEY + '-g';
const PHONE_TOPIC = () => 'lensdeck-' + KEY + '-p';
const parts = {};
function publish(obj) {
  return fetch('https://ntfy.sh/' + PHONE_TOPIC(), { method: 'POST', body: JSON.stringify(obj) }).catch(() => {});
}
function send(obj) { if (ctl && ctl.readyState === 'open') ctl.send(JSON.stringify(obj)); else toast('Téléphone non connecté'); }
function sayHello() { const now = Date.now(); if (now - lastHello < 6000) return; lastHello = now; publish({ t: 'hello' }); }
function publishSdp(kind, sdp) {
  const id = Math.random().toString(16).slice(2, 12);
  const n = Math.ceil(sdp.length / 2800);
  for (let i = 0; i < n; i++) publish({ t: 'part', id, i, n, k: kind, d: sdp.slice(i * 2800, (i + 1) * 2800) });
}

function connect() {
  if (!live) setStatus('Connexion…');
  ws = new WebSocket('wss://ntfy.sh/' + MY_TOPIC() + '/ws');
  ws.onopen = () => {
    if (!live) setStatus('En attente du téléphone…', 'Sur ton S25 : LensDeck → « Caster mon écran sur mes lunettes »');
    lastHello = 0; sayHello();
    clearInterval(helloTimer); helloTimer = setInterval(() => { if (!live) sayHello(); }, 10000);
  };
  ws.onmessage = (e) => { try { const ev = JSON.parse(e.data); if (ev.event === 'message') onSignal(JSON.parse(ev.message)); } catch (err) {} };
  ws.onclose = () => { clearInterval(helloTimer); setTimeout(connect, 3000); };
}
function onSignal(p) {
  if (p.t === 'ping') { lastHello = 0; sayHello(); }
  else if (p.t === 'part') {
    const arr = parts[p.id] || (parts[p.id] = new Array(p.n).fill(null));
    arr[p.i] = p.d;
    if (arr.every((x) => x !== null)) { delete parts[p.id]; if (p.k === 'offer') handleOffer(arr.join('')); }
  }
}
function waitGathering(peer, ms) {
  return new Promise((res) => {
    if (peer.iceGatheringState === 'complete') return res();
    const t = setTimeout(res, ms);
    peer.addEventListener('icegatheringstatechange', () => { if (peer.iceGatheringState === 'complete') { clearTimeout(t); res(); } });
  });
}
async function handleOffer(sdp) {
  if (pc) { try { pc.close(); } catch (e) {} }
  const peer = new RTCPeerConnection({ iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] });
  pc = peer;
  setStatus('Connexion au téléphone…');
  peer.ontrack = (e) => { v.srcObject = e.streams[0] || new MediaStream([e.track]); v.play().catch(() => {}); };
  peer.ondatachannel = (e) => { ctl = e.channel; };
  peer.onconnectionstatechange = () => {
    if (peer !== pc) return;
    const s = peer.connectionState;
    if (s === 'connected') { live = true; setStatus(''); toast('1 pincement = curseur · 2 = menu'); }
    else if (s === 'failed' || s === 'closed') { live = false; setStatus('Lien perdu', 'Reconnexion…'); lastHello = 0; sayHello(); }
    else if (s === 'disconnected') { setStatus('Lien instable…'); }
  };
  try {
    await peer.setRemoteDescription({ type: 'offer', sdp });
    const answer = await peer.createAnswer();
    await peer.setLocalDescription(answer);
    await waitGathering(peer, 3000);
    if (peer !== pc) return;
    publishSdp('answer', peer.localDescription.sdp);
  } catch (err) { setStatus('Erreur de connexion', String(err && err.message || err)); }
}

// ---------------------------------------------------------------- Statistiques (renvoyées au téléphone)
let lastBytes = 0, lastT = 0;
setInterval(async () => {
  if (!pc || !live) return;
  try {
    const stats = await pc.getStats();
    stats.forEach((r) => {
      if (r.type === 'inbound-rtp' && (r.kind === 'video' || r.mediaType === 'video')) {
        const now = performance.now();
        const kbps = lastT ? Math.round((r.bytesReceived - lastBytes) * 8 / (now - lastT)) : 0;
        lastBytes = r.bytesReceived; lastT = now;
        const fps = Math.round(r.framesPerSecond || 0);
        infoEl.textContent = fps + ' img/s · ' + kbps + ' kb/s · ' + v.videoWidth + '×' + v.videoHeight;
        if (ctl && ctl.readyState === 'open') ctl.send(JSON.stringify({ c: 'stats', fps, kbps }));
      }
    });
  } catch (e) {}
}, 2000);

// ---------------------------------------------------------------- Démarrage
if (!KEY) {
  setStatus('Adresse incomplète', 'Sur ton S25 : LensDeck → Cast Wi-Fi → « Adresse de ton récepteur », puis ajoute-la dans Meta AI.');
} else {
  connect();
}
</script>
</body>
</html>
